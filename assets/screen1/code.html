<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        body {
            background-color: #121212;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid #2e2e2e;
        }
        .amber-glow {
            box-shadow: 0 0 40px -10px rgba(255, 179, 0, 0.3);
        }
        .meter-animation {
            animation: pulse-border 3s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: #2e2e2e; }
            50% { border-color: #ffb300; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen overflow-hidden">
<!-- Top Navigation Header -->
<header class="bg-background dark:bg-background text-primary dark:text-primary text-label-md font-label-md w-full top-0 flat no shadows flex justify-end items-center w-full px-margin-mobile h-16 transition-opacity duration-200">
<button class="hover:opacity-80 transition-opacity text-on-surface-variant font-label-md">Skip</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative">
<!-- Background Atmospheric Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[60%] opacity-10 pointer-events-none">

</div>
<div class="z-10 w-full max-w-sm flex flex-col items-center">
<!-- Icon/Visual Area -->
<div class="relative w-48 h-48 mb-lg flex items-center justify-center">
<div class="absolute inset-0 rounded-full border border-[#2e2e2e] meter-animation"></div>
<div class="absolute inset-4 rounded-full border border-[#2e2e2e] opacity-50"></div>
<div class="glass-card w-32 h-32 rounded-3xl flex items-center justify-center amber-glow border-[#2e2e2e]">
<span class="material-symbols-outlined text-[64px] text-primary-container" style="font-variation-settings: 'FILL' 1;">
                        gas_meter
                    </span>
</div>
<!-- Floating Data Elements -->
<div class="absolute -top-4 -right-2 glass-card py-xs px-sm rounded-lg text-[10px] font-label-md text-primary tracking-widest border-[#2e2e2e]">
                    REAL-TIME
                </div>
<div class="absolute -bottom-2 -left-4 glass-card py-xs px-sm rounded-lg border-[#2e2e2e]">
<span class="material-symbols-outlined text-secondary-fixed text-sm">precision_manufacturing</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-sm">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-background tracking-tight">
                    Precision Pumping
                </h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                    Log opening and closing pump meter readings straight from the forecourt. Eliminate manual paper ledgers.
                </p>
</div>
<!-- Bento-style Feature Highlight (Micro-pattern) -->
<div class="mt-xl grid grid-cols-2 gap-sm w-full">
<div class="glass-card p-sm rounded-xl border-[#2e2e2e] flex flex-col gap-xs">
<span class="material-symbols-outlined text-primary text-body-lg">history</span>
<span class="text-[11px] font-label-md uppercase tracking-wider text-on-surface-variant">Log History</span>
</div>
<div class="glass-card p-sm rounded-xl border-[#2e2e2e] flex flex-col gap-xs">
<span class="material-symbols-outlined text-primary text-body-lg">cloud_upload</span>
<span class="text-[11px] font-label-md uppercase tracking-wider text-on-surface-variant">Instant Sync</span>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col items-center gap-md px-margin-mobile pb-xl bg-background dark:bg-background flat no shadows">
<!-- Pagination Dots -->
<div class="flex items-center gap-xs">
<!-- Dot 1 -->
<div class="bg-surface-variant text-on-surface-variant rounded-full w-2 h-2 transition-all duration-300"></div>
<!-- Dot 2 (Active) -->
<div class="bg-primary text-on-primary rounded-full w-12 h-2 transition-all duration-300"></div>
<!-- Dot 3 -->
<div class="bg-surface-variant text-on-surface-variant rounded-full w-2 h-2 transition-all duration-300"></div>
<!-- Dot 4 -->
<div class="bg-surface-variant text-on-surface-variant rounded-full w-2 h-2 transition-all duration-300"></div>
</div>
<!-- Action Button -->
<button class="bg-primary-container text-on-primary-container w-full h-14 rounded-xl flex items-center justify-center gap-sm font-label-md text-label-md hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-black/20">
            Next
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.bg-primary-container');
            nextBtn.addEventListener('click', () => {
                nextBtn.innerHTML = `
                    <span class="animate-spin material-symbols-outlined">progress_activity</span>
                `;
                setTimeout(() => {
                    // Simulation of transition
                    console.log('Navigating to Screen 3...');
                }, 800);
            });
        });
    </script>
