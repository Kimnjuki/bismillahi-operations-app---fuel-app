<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #e5e2e1;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glow-amber {
            box-shadow: 0 0 20px rgba(255, 179, 0, 0.3);
        }

        .glass-panel {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 46, 46, 1);
        }

        /* Ambient background movement */
        .ambient-glow {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at center, rgba(255, 179, 0, 0.05) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>

<body class="flex flex-col h-screen overflow-hidden">
<div class="ambient-glow"></div>
<!-- Top Navigation Bar -->
<header class="flex justify-end items-center w-full px-margin-mobile h-16 bg-background">
<button class="text-primary font-label-md text-label-md hover:opacity-80 transition-opacity duration-200">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile relative">
<!-- Large Modern Financial Icon / Content Area -->
<div class="w-full max-w-xs flex flex-col items-center mb-12">
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Decorative background elements for the icon -->
<div class="absolute inset-0 bg-primary-container opacity-10 rounded-full blur-3xl"></div>
<div class="absolute inset-0 border border-primary/20 rounded-full animate-pulse"></div>
<!-- Main Icon -->
<div class="glass-panel w-32 h-32 rounded-3xl flex items-center justify-center relative z-10 glow-amber transform rotate-3">
<span class="material-symbols-outlined text-primary text-[64px]" style="font-variation-settings: 'FILL' 1;">
                        currency_exchange
                    </span>
</div>
<!-- Floating Currency Tokens -->
<div class="absolute -top-4 -right-4 glass-panel px-sm py-xs rounded-lg text-primary font-bold text-xs animate-bounce" style="animation-delay: 0.1s">USD</div>
<div class="absolute top-1/2 -left-8 glass-panel px-sm py-xs rounded-lg text-primary font-bold text-xs animate-bounce" style="animation-delay: 0.3s">CDF</div>
<div class="absolute bottom-4 -right-4 glass-panel px-sm py-xs rounded-lg text-primary font-bold text-xs animate-bounce" style="animation-delay: 0.5s">KES</div>
</div>
</div>
<!-- Typography Section -->
<div class="text-center space-y-md max-w-md">
<h1 class="text-on-background font-headline-lg-mobile text-headline-lg-mobile">
                Smart Financials
            </h1>
<p class="text-on-surface-variant font-body-md text-body-md leading-relaxed px-sm">
                Track localized shift expenses and sales across <span class="text-primary font-semibold">USD</span>, <span class="text-primary font-semibold">CDF</span>, and <span class="text-primary font-semibold">KES</span> seamlessly with real-time conversion.
            </p>
</div>
<!-- Financial Dashboard Teaser (Bento Element) -->
<div class="mt-lg w-full max-w-sm glass-panel p-sm rounded-xl grid grid-cols-2 gap-xs opacity-60">
<div class="h-16 bg-surface-container rounded-lg border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm mr-xs">trending_up</span>
<div class="h-2 w-12 bg-outline-variant rounded-full"></div>
</div>
<div class="h-16 bg-surface-container rounded-lg border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm mr-xs">bar_chart</span>
<div class="h-2 w-12 bg-outline-variant rounded-full"></div>
</div>
</div>
</main>
<!-- Bottom Action Shell -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col items-center gap-md px-margin-mobile pb-xl bg-background">
<!-- Pagination Dots -->
<div class="flex items-center gap-xs h-2">
<div class="bg-surface-variant rounded-full w-2 h-2"></div>
<div class="bg-surface-variant rounded-full w-2 h-2"></div>
<div class="bg-surface-variant rounded-full w-2 h-2"></div>
<div class="bg-primary text-on-primary rounded-full w-12 h-2 transition-all duration-300"></div>
</div>
<!-- Primary CTA -->
<button class="w-full max-w-md h-14 bg-primary-container hover:brightness-110 active:scale-95 transition-transform rounded-xl flex items-center justify-center gap-sm glow-amber">
<span class="text-on-primary font-label-md text-label-md">Get Started</span>
<span class="material-symbols-outlined text-on-primary">arrow_forward</span>
</button>
</footer>
<script>
        // Micro-interaction: Subtle parallax on the icon panel
        document.addEventListener('mousemove', (e) => {
            const panels = document.querySelectorAll('.glass-panel');
            const mouseX = (e.clientX / window.innerWidth - 0.5) * 15;
            const mouseY = (e.clientY / window.innerHeight - 0.5) * 15;
            
            panels.forEach((panel, index) => {
                const depth = (index + 1) * 0.5;
                panel.style.transform = `translate(${mouseX * depth}px, ${mouseY * depth}px) ${panel.classList.contains('rotate-3') ? 'rotate(3deg)' : ''}`;
            });
        });
    </script>
</body></html>
